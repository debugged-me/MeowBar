name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    # The popover uses macOS 26 APIs behind #available, so it needs the
    # macOS 26 SDK (Xcode 26) to compile.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # macos-26 images ship several Xcodes and xcode-select may not point at
      # the newest — pick it explicitly or swiftc can't see macOS 26 symbols
      # (glassEffect & friends) and the build step fails every push.
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "xcode-select → $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swiftc --version
      - name: Test
        run: swift test
      - name: Build app + DMG
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MeowBar
          path: |
            build/MeowBar.dmg
            build/version.json

  # Tag push (v*) → GitHub Release with the DMG and the update feed. The
  # app's MeowBarUpdateURL reads version.json from the latest release, so
  # tagging a version is the whole ship-it flow.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "xcode-select → $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swiftc --version
      - name: Build app + DMG
        run: ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MeowBar.dmg build/version.json \
            --title "MeowBar $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" build/MeowBar.dmg build/version.json --clobber
